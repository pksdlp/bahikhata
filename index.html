 el.style.zIndex=100+stack.length*2;
 const L=Object.assign({k,el},o);el._L=L;stack.push(L);$("layers").appendChild(el);
 L.build(L);

 return L;
}

});

const fmtRange=x=>fmtDate(x.date)+(x.date2&&x.date2!==x.date?" → "+fmtDate(x.date2):"");
const cmpTx=(a,b)=>String(a.date).localeCompare(String(b.date))||String(a.at).localeCompare(String(b.at));
function entryStatus(pid,ex){
 const gs=DB.tx.filter(x=>x.pid===pid&&x.type==="gave"&&x.id!==ex).sort(cmpTx);
 const gots=DB.tx.filter(x=>x.pid===pid&&x.type==="got"&&x.id!==ex).sort(cmpTx);
 const st={};gs.forEach(g=>{st[g.id]={g,amt:num(g.amount),paid:0,pays:[]}});
 const free=[];
 gots.forEach(r=>{
  let used=0;
  (r.alloc||[]).forEach(a=>{const q=st[a.id];if(!q)return;const v=Math.min(num(a.amt),q.amt-q.paid);if(v>0){q.paid+=v;used+=v;q.pays.push({tx:r,amt:v,auto:false})}});
  const left=r2(num(r.amount)-used);if(left>0)free.push({tx:r,left});
 });
 free.forEach(f=>{let left=f.left;for(const g of gs){const q=st[g.id],rem=q.amt-q.paid;if(rem<=0)continue;const v=Math.min(rem,left);q.paid+=v;left-=v;q.pays.push({tx:f.tx,amt:v,auto:true});if(left<=0)break}});
 return {list:gs.map(g=>{const q=st[g.id];q.paid=r2(q.paid);q.rem=r2(q.amt-q.paid);q.pays.sort((a,b)=>cmpTx(a.tx,b.tx));return q})};
}

 const enc=new TextEncoder(),parts=[],offs=[];let len=0;
 const add=x=>{const b=typeof x==="string"?enc.encode(x):x;parts.push(b);len+=b.length};
 const obj=(n,fn)=>{offs[n]=len;add(n+" 0 obj\n");fn();add("\nendobj\n")};
 const N=jpgs.length;
 add("%PDF-1.4\n");
 obj(1,()=>add("<< /Type /Catalog /Pages 2 0 R >>"));
 obj(2,()=>add("<< /Type /Pages /Count "+N+" /Kids ["+jpgs.map((_,i)=>(3+3*i)+" 0 R").join(" ")+"] >>"));
 jpgs.forEach((j,i)=>{
  const pg=3+3*i,ct=4+3*i,im=5+3*i,cs="q 595.28 0 0 841.89 0 0 cm /Im0 Do Q";
  obj(pg,()=>add("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 "+im+" 0 R >> >> /Contents "+ct+" 0 R >>"));
  obj(ct,()=>add("<< /Length "+cs.length+" >>\nstream\n"+cs+"\nendstream"));
  obj(im,()=>{add("<< /Type /XObject /Subtype /Image /Width "+j.w+" /Height "+j.h+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+j.bytes.length+" >>\nstream\n");add(j.bytes);add("\nendstream")});
 });
 const total=3*N+3,xr=len;
 add("xref\n0 "+total+"\n0000000000 65535 f \n");
 for(let n=1;n<total;n++)add(String(offs[n]).padStart(10,"0")+" 00000 n \n");
 add("trailer\n<< /Size "+total+" /Root 1 0 R >>\nstartxref\n"+xr+"\n%%EOF");
 return new Blob(parts,{type:"application/pdf"});
}

function calcEval(expr){

 if(!s.trim())return 0;
 if(!/^[0-9+\-*/.() ]+$/.test(s))return null;
 try{const v=Function('"use strict";return ('+s+')')();return isFinite(v)?r2(v):null}catch(e){return null}
}

 e.querySelector(".ex").textContent=L.expr||"0";
 e.querySelector(".cres").textContent=v==null?"…":String(v);
 e.querySelector(".th").textContent=txTitle(L);
 const as=e.querySelector(".allocsum");if(as){let sm=0;e.querySelectorAll(".f-al").forEach(i=>{sm+=num(i.value)});as.textContent=t("alsum",money(sm),money(v||0));as.style.color=sm>(v||0)+0.001?"var(--bad)":""}
}
function buildTx(L){
 const x=L.txid?DB.tx.find(a=>a.id===L.txid):null;
 if(x&&L.expr===undefined){L.expr=String(x.amount);L.note=x.note;L.date=x.date;L.date2=x.date2||"";L.type=x.type;L.cid=x.pid;L.al={};(x.alloc||[]).forEach(a=>{L.al[a.id]=a.amt})}
 if(!L.al)L.al={};
 if(!x&&L.pre&&L.expr===undefined){const q=entryStatus(L.cid).list.find(a=>a.g.id===L.pre);if(q&&q.rem>0){L.expr=String(q.rem);L.al[L.pre]=q.rem}}
 if(L.expr===undefined)L.expr="";
 if(!L.date)L.date=today();if(L.note===undefined)L.note="";
 const gave=L.type==="gave";
 let alh="";
 if(!gave){
  const lst=entryStatus(L.cid,x?x.id:null).list.filter(q=>q.rem>0);
  if(lst.length)alh=`<div class="fc"><div class="hd" style="margin:0 0 4px"><label style="margin:0">${t("alloc")}</label><button type="button" class="sm" data-act="autoal">${t("autoal")}</button></div><div class="sub" style="margin-bottom:6px">${t("alhint")}</div>${lst.map(q=>`<div class="row" style="padding:6px 0"><div class="n"><b style="font-size:0.875rem">${fmtRange(q.g)}</b><div class="sub">${q.g.note?esc(q.g.note)+" • ":""}${t("due")} ${money(q.rem)}</div></div><input class="f-al" type="number" inputmode="decimal" min="0" step="any" data-id="${esc(q.g.id)}" data-rem="${q.rem}" placeholder="0" style="width:96px;text-align:right" value="${esc(L.al[q.g.id]||"")}"></div>`).join("")}<div class="sub allocsum" style="text-align:right;margin-top:4px"></div></div>`;
 }
 const rows=[["C","⌫","%","÷"],["7","8","9","×"],["4","5","6","−"],["1","2","3","+"],["0",".","="]];
 L.el.innerHTML=`<div class="lh ${gave?"red":"grn"}"><span style="width:40px">${x?`<button class="ic" data-act="deltx" data-id="${esc(x.id)}">🗑️</button>`:""}</span><span class="th"></span><button class="ic" data-act="back">✕</button></div>
 <div class="lb"><div class="fc"><label>${t("amount")}</label><div class="amt">₹ <span class="ex"></span></div></div>
 <div class="fc"><label>${t("noteopt")}</label><input class="f-note" placeholder="${t("addnote")}" value="${esc(L.note)}"></div>
 <div class="fc"><div style="display:flex;gap:12px"><div style="flex:1"><label>${t("datefrom")}</label><input class="f-date" type="date" value="${esc(L.date)}"></div><div style="flex:1"><label>${t("dateto")}</label><input class="f-date2" type="date" value="${esc(L.date2||"")}"></div></div></div>
 ${alh}
 <div class="calc"><div class="cres"></div><div class="keys">${rows.map(r=>r.map(k=>`<button type="button" data-act="key" data-k="${k}" class="${k==="0"?"z":ops.includes(k)||k==="="?"op":(k==="C"||k==="⌫"||k==="%")?"fn":""}">${k}</button>`).join("")).join("")}</div></div></div>
 <div class="lbar"><button class="big ${gave?"red":"grn"}" data-act="savetx">${t("savetx")}</button></div>`;
 updTx(L);
}

 key(el){
  const L=layerOf(el),k=el.dataset.k;let e=L.expr;
  if(k==="C")e="";
  else if(k==="⌫")e=e.slice(0,-1);
  else if(k==="="){const v=calcEval(strip(e));if(v!=null&&e)e=String(v)}
  else if(ops.includes(k)){if(!e)return;e=ops.includes(e.slice(-1))?e.slice(0,-1)+k:e+k}
  else if(k==="%"){if(!e||/[+−×÷%.]$/.test(e))return;e+="%"}
  else if(k==="."){const seg=e.split(/[+−×÷]/).pop();if(seg.includes("."))return;e+=seg===""?"0.":"."}
  else e+=k;
  L.expr=e;updTx(L);
 },
 savetx(el){
  const L=layerOf(el),v=txVal(L);
  if(!v||v<=0){toast(t("badamt"));return}
  const note=L.el.querySelector(".f-note").value.trim(),date=L.el.querySelector(".f-date").value||today(),date2=L.el.querySelector(".f-date2").value||"";
  if(date2&&date2<date){toast(t("baddate"));return}
  const x=L.txid&&DB.tx.find(a=>a.id===L.txid);
  const alloc=[];let sum=0;
  if(L.type==="got"){
   const lst=entryStatus(L.cid,x?x.id:null).list;
   L.el.querySelectorAll(".f-al").forEach(i=>{let a=r2(i.value);if(a>0){const q=lst.find(z=>z.g.id===i.dataset.id);if(q)a=Math.min(a,q.rem);if(a>0){alloc.push({id:i.dataset.id,amt:a});sum+=a}}});
   if(sum>v+0.001){toast(t("overal"));return}
  }
  if(x){x.amount=v;x.note=note;x.date=date;x.date2=date2;x.alloc=alloc}
  else DB.tx.push({id:uid(),pid:L.cid,type:L.type,amount:v,date,date2,note,alloc,at:new Date().toISOString()});
  save();back();render();
 },
 deltx(el){
  const id=el.dataset.id,x=DB.tx.find(a=>a.id===id);if(!x||!confirm(t("deltx")))return;
  DB.tx=DB.tx.filter(a=>a.id!==id);save();back();render();

  const L=layerOf(el),e=L.el;

  try{
   const r=await navigator.contacts.select(["name","tel"],{multiple:false});if(!r||!r.length)return;
   const c=r[0],nm=(c.name&&c.name[0]||"").trim();
   let d=String((c.tel&&c.tel[0])||"").replace(/\D/g,"");if(d.length>10&&d.startsWith("91"))d=d.slice(2);d=d.replace(/^0+(?=\d{10}$)/,"");
   if(!d){toast(t("nonum"));return}
   e.querySelector(".f-phone").value=d;const n=e.querySelector(".f-name");if(nm&&!n.value.trim())n.value=nm;
  }catch(x){if(x&&x.name!=="AbortError")toast(t("noread"))}

function applyTheme(n){
 n=n==="gold"?"gold":"red";
 document.documentElement.dataset.theme=n;
 try{localStorage.setItem("bk_theme",n)}catch(e){}
 const m=document.getElementById("tc");if(m)m.setAttribute("content",n==="gold"?"#000000":"#b71c1c");
}
function closeMenu(){const m=document.querySelector(".menu");if(m)m.remove()}
/* ---------- ईवेंट ---------- */
document.addEventListener("click",e=>{
 const w=e.target.closest(".dlgwrap");
 if(w&&e.target===w){back();return}
 const el=e.target.closest("[data-act]");
 if(!el){if(!e.target.closest(".menu"))closeMenu();return}
 const f=ACT[el.dataset.act];if(f){e.preventDefault();f(el,e)}
});
document.addEventListener("input",e=>{
 if(e.target.classList&&e.target.classList.contains("f-al")){const L=layerOf(e.target);if(L)updTx(L)}
 if(e.target.id==="q"){S.q=e.target.value;const l=$("plist");if(l)l.innerHTML=listHtml()}
});
document.addEventListener("change",async e=>{
 const el=e.target;if(!el.classList||!el.classList.contains("f-img"))return;
 const f=el.files[0];if(!f)return;const L=layerOf(el);if(!L)return;
 try{syncProf(L);const k=el.dataset.k;L[k]=await imgToData(f,k==="logo"?300:700,"png");buildProfile(L)}catch(x){toast(t("imgerr"))}
});
$("imp").addEventListener("change",e=>{
 const f=e.target.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=()=>{try{
  const d=JSON.parse(r.result);if(!d||!Array.isArray(d.parties)||!Array.isArray(d.tx)||!Array.isArray(d.cash))throw 0;
  if(!confirm(t("restoreq")))return;
  DB=migrate(d);save();render();toast(t("restored"));
 }catch(x){toast(t("badfile"))}};
 r.readAsText(f);e.target.value="";
});
let deferred=null;
applyTheme(document.documentElement.dataset.theme);
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e});
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("service-worker.js").catch(()=>{}));
render();
</script>
